<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tristan Vegas — Interactive Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{--bg:#faf6ee;--surface:#fffdf8;--text:#2a2420;--muted:#6f655b;--line:#e6dccb;--accent:#c4552d;--soft:#f6e1d6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--surface:#1e1b16;--text:#f1ebe0;--muted:#a79d8f;--line:#332e26;--accent:#f08a5d;--soft:#3a2a20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15130f;--surface:#1e1b16;--text:#f1ebe0;--muted:#a79d8f;--line:#332e26;--accent:#f08a5d;--soft:#3a2a20;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
/* circular theme transition */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
.hero{max-width:1040px;margin:0 auto;padding:96px 20px 64px;min-height:100vh;display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center}
.eyebrow{display:inline-block;background:var(--soft);color:var(--accent);padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;margin-bottom:18px}
.hero h1{font:700 clamp(38px,6vw,64px)/1.08 Fraunces,Georgia,serif;letter-spacing:-.02em;margin:0}
.hero h1 em{color:var(--accent);font-style:normal}
/* text reveal */
.line{display:block;overflow:hidden;padding-bottom:.08em}
.line>span{display:block;transform:translateY(110%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.12s + .15s)}
@keyframes up{to{transform:none}}
.fade{opacity:0;animation:fade .8s ease forwards;animation-delay:.6s}
@keyframes fade{to{opacity:1}}
.hero p{color:var(--muted);max-width:500px;margin:18px 0 26px;font-size:17px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 24px;border-radius:12px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--text);color:var(--text);cursor:pointer;will-change:transform}
.btn.p{background:var(--text);color:var(--bg)}
/* 3D parallax stage */
.stage{width:min(380px,82vw);aspect-ratio:4/5;justify-self:center;perspective:900px}
.tilt{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateY(calc(var(--mx,0)*12deg)) rotateX(calc(var(--my,0)*-12deg))}
.tilt>*{position:absolute}
.blob{inset:4% -6% -4% 6%;background:var(--accent);border-radius:42% 58% 55% 45%/50% 45% 55% 50%;transform:translateZ(-60px);opacity:.9}
.ring{inset:-4% 8% 10% -8%;border:2px dashed var(--line);border-radius:50%;transform:translateZ(-20px)}
.photo{inset:0;border-radius:200px 200px 28px 28px;overflow:hidden;background:var(--soft);border:2px solid var(--surface);box-shadow:0 24px 50px rgba(0,0,0,.18)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 14px;font-size:13px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.12);animation:bob 4s ease-in-out infinite}
.c1{top:8%;left:-14%;transform:translateZ(80px)}.c2{bottom:22%;right:-12%;transform:translateZ(100px);animation-delay:-1.3s}.c3{bottom:-3%;left:6%;transform:translateZ(70px);animation-delay:-2.4s}
@keyframes bob{50%{translate:0 -8px}}
/* theme toggle + cursor */
.theme{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;z-index:20;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:18px;cursor:pointer}
.cursor{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid var(--accent);border-radius:50%;pointer-events:none;z-index:30;transition:width .2s,height .2s,margin .2s,background .2s}
.cursor.big{width:64px;height:64px;margin:-32px 0 0 -32px;background:color-mix(in srgb,var(--accent) 18%,transparent)}
@media(hover:none){.cursor{display:none}}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:88px}.stage{order:-1}}
@media(prefers-reduced-motion:reduce){.line>span,.fade{animation:none;transform:none;opacity:1}.chip{animation:none}.tilt{transform:none}}

</style></head><body>

<p class="fade">Full-stack developer working with Next.js, React, TypeScript, Laravel and PostgreSQL, now shipping AI-powered apps.</p>

<script>
const root=document.documentElement,btn=document.getElementById("theme"),stage=document.getElementById("stage"),tilt=document.getElementById("tilt");
const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
const sync=()=>btn.textContent=isDark()?"☀":"☾";
try{const t=localStorage.getItem("theme");if(t)root.dataset.theme=t}catch(e){}
sync();
btn.onclick=()=>{const next=isDark()?"light":"dark";
const apply=()=>{root.dataset.theme=next;try{localStorage.setItem("theme",next)}catch(e){}sync()};
if(!document.startViewTransition||matchMedia("(prefers-reduced-motion:reduce)").matches)return apply();
const b=btn.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2,r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
document.startViewTransition(apply).ready.then(()=>root.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:600,easing:"ease-in-out",pseudoElement:"::view-transition-new(root)"}))};
// smooth tilt
let tx=0,ty=0,cx=0,cy=0;
stage.onmousemove=e=>{const r=stage.getBoundingClientRect();tx=(e.clientX-r.left)/r.width-.5;ty=(e.clientY-r.top)/r.height-.5};
stage.onmouseleave=()=>{tx=ty=0};
(function loop(){cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;tilt.style.setProperty("--mx",cx*2);tilt.style.setProperty("--my",cy*2);requestAnimationFrame(loop)})();
// magnetic buttons
document.querySelectorAll(".mag").forEach(el=>{
el.style.transition="transform .25s cubic-bezier(.2,.8,.2,1)";
el.onmousemove=e=>{const r=el.getBoundingClientRect();el.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.3}px,${(e.clientY-r.top-r.height/2)*.3}px)`};
el.onmouseleave=()=>el.style.transform=""});
// cursor
const cur=document.getElementById("cur");
addEventListener("mousemove",e=>{cur.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;cur.classList.toggle("big",!!e.target.closest("a,button"))});
</script></body></html>
